<!DOCTYPE html>
<html lang="en" data-theme="amber">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AtomNano</title>
  <!-- Stylesheet partials — load order is cascade order (see src/renderer/styles/). -->
  <link rel="stylesheet" href="./styles/00-base.css" />
  <link rel="stylesheet" href="./styles/10-titlebar-tabs.css" />
  <link rel="stylesheet" href="./styles/20-sidebar.css" />
  <link rel="stylesheet" href="./styles/30-git-overlays.css" />
  <link rel="stylesheet" href="./styles/40-chat.css" />
  <link rel="stylesheet" href="./styles/50-composer.css" />
  <link rel="stylesheet" href="./styles/60-docks.css" />
  <link rel="stylesheet" href="./styles/65-agents.css" />
  <link rel="stylesheet" href="./styles/67-workflow.css" />
  <link rel="stylesheet" href="./styles/68-board.css" />
  <link rel="stylesheet" href="./styles/70-overlays.css" />
  <link rel="stylesheet" href="./styles/72-settings.css" />
  <link rel="stylesheet" href="./styles/75-chat-layout.css" />
  <link rel="stylesheet" href="./styles/80-editor.css" />
  <link rel="stylesheet" href="./styles/85-git-center.css" />
  <link rel="stylesheet" href="./styles/90-chat-search-queue.css" />
  <link rel="stylesheet" href="./styles/92-dbm.css" />
  <link rel="stylesheet" href="./styles/94-chat-navigation.css" />
  <link rel="stylesheet" href="./styles/95-commit-modal.css" />
  <link rel="stylesheet" href="./styles/96-terminal.css" />
  <link rel="stylesheet" href="./styles/97-git-center-updates.css" />
  <link rel="stylesheet" href="./styles/98-dbm-updates.css" />
  <!-- Terminal emulator (built by `npm run build:term`). Both files are optional:
       if absent, the integrated terminal falls back to its legacy line pane. -->
  <link rel="stylesheet" href="./vendor/xterm.bundle.css" />
</head>
<body>
  <div id="app">
    <!-- Title bar -->
    <header id="titlebar">
      <div class="tb-left">
        <span id="brandMark" class="brand-mark"></span>
        <span class="brand-name">Atom<span class="brand-accent">Nano</span></span>
        <div id="tbActions" class="tb-actions"></div>
      </div>
      <div class="tb-drag"></div>
      <div class="tb-right">
        <button class="win-btn" id="winMin" title="Minimize"></button>
        <button class="win-btn" id="winMax" title="Maximize"></button>
        <button class="win-btn win-close" id="winClose" title="Close"></button>
      </div>
    </header>

    <!-- Body -->
    <div id="body">
      <aside id="sidebar">
        <div id="folderBar"></div>
        <div id="fileTree" class="file-tree"></div>
        <div id="sidebarFooter"></div>
      </aside>

      <div id="sidebarResizer" class="resizer"></div>

      <section id="editorPane" class="hidden">
        <div id="editorTabs" class="editor-tabs"></div>
        <div id="editorBreadcrumbs" class="editor-breadcrumbs hidden"></div>
        <div id="editorBody" class="editor-body"></div>
        <div id="editorStatus" class="editor-status"></div>
      </section>

      <div id="editorResizer" class="resizer hidden"></div>

      <main id="main">
        <div id="chatHeader" class="chat-header">
          <div id="tabs" class="cht-tabs"></div>
          <button id="tabOverflow" class="cht-overflow hidden" title="Hidden sessions"></button>
          <div class="cht-actions">
            <div id="headerProvider" class="cht-provider"></div>
            <button id="chatSearchBtn" class="cht-act" title="Find in conversation (Ctrl+F)"></button>
            <button id="newTab" class="cht-act" title="New session (Ctrl+T)"></button>
            <button id="chatMore" class="cht-act" title="More"></button>
          </div>
        </div>
        <div id="chatWrap">
          <div id="chat" class="chat"></div>
        </div>
        <div id="composer"></div>
      </main>

      <div id="changesResizer" class="resizer hidden"></div>

      <aside id="changesPanel" class="changes-panel hidden"></aside>
      <aside id="fleetPanel" class="side-dock hidden"></aside>
      <aside id="testsPanel" class="side-dock hidden"></aside>
      <aside id="agentsPanel" class="side-dock hidden"></aside>
      <aside id="boardPanel" class="side-dock hidden"></aside>
    </div>
  </div>

  <div id="ctxMenu" class="ctx-menu hidden"></div>
  <div id="modalRoot"></div>
  <div id="toast" class="toast hidden"></div>

  <!-- Classic script, so it runs and sets window.Terminal before the deferred
       app.js module. A 404 here is harmless — app.js checks for window.Terminal. -->
  <script src="./vendor/xterm.bundle.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
